[project]
name = "agentx-tests"
version = "0.1.0"
description = "Python-only system acceptance and E2E dependencies for Agentx"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-timeout>=2.3,<3",
  "PyYAML>=6.0.2,<7",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests/acceptance", "tests/e2e"]
cache_dir = ".local/cache/pytest"
markers = [
  "infrastructure: Kubernetes infrastructure and data-domain scenarios",
  "publishing: bundle publishing and activation scenarios",
  "gateway: invocation, webhook, and SSE scenarios",
  "runtime: workflow runtime, worker, recovery, and sandbox scenarios",
  "observability: trace ingestion and query scenarios",
  "security: isolation, secret, and network-policy scenarios",
  "upgrade: migration, backup, upgrade, and rollback scenarios",
  "product: full product and Playwright scenarios",
  "cluster: requires an accessible Kubernetes cluster",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".local", "contracts/vendor"]
cache-dir = ".local/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["E501", "S603", "S607", "SIM115"]
allowed-confusables = ["（", "）", "，", "：", "；"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]
