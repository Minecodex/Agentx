name: quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-helm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        shell: bash
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4
      - run: uv sync --frozen --group test
      - run: cargo xtask check --fast

  kubernetes-e2e-linux:
    if: ${{ vars.AGENTX_E2E_LINUX_ENABLED == 'true' }}
    needs: python-helm
    runs-on: [self-hosted, linux, agentx-e2e, strict-cni]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - run: uv sync --frozen --group test
      - run: cargo build -p agentxctl -p agentx-backup-test-adapter
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: uv run --frozen --group test pytest tests/e2e --values deploy/values/dockerhub-beta.yaml --timeout=7200

  kubernetes-e2e-windows:
    if: ${{ vars.AGENTX_E2E_WINDOWS_ENABLED == 'true' }}
    needs: python-helm
    runs-on: [self-hosted, windows, agentx-e2e, docker-desktop]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - run: uv sync --frozen --group test
      - run: cargo build -p agentxctl -p agentx-backup-test-adapter
      - run: corepack enable; pnpm install --frozen-lockfile
      - run: uv run --frozen --group test pytest tests/e2e --values deploy/values/dockerhub-beta.yaml --timeout=7200

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm --filter @agentx/web test --maxWorkers=2
      - run: pnpm build:web
      - run: pnpm --filter @agentx/e2e exec tsc --noEmit

  ci-gate:
    name: CI
    if: ${{ always() }}
    needs: ["python-helm", "frontend", "kubernetes-e2e-linux", "kubernetes-e2e-windows"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          optional = set(["kubernetes-e2e-linux", "kubernetes-e2e-windows"])
          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in jobs.items()
              if job["result"] != "success"
              and not (name in optional and job["result"] == "skipped")
          }
          if failed:
              print(f"Required CI jobs did not succeed: {failed}")
              sys.exit(1)
          print("All mandatory CI jobs passed.")
          PY
