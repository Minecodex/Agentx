name: quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-helm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        shell: bash
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.4
      - run: uv sync --frozen --group test
      - run: cargo xtask check --fast

  kubernetes-e2e-linux:
    needs: python-helm
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-tools
      - name: Run all system domains in disposable Minikube
        env:
          AGENTX_E2E_KIMI_API_KEY: ${{ secrets.AGENTX_E2E_KIMI_API_KEY }}
        run: >-
          uv run --frozen --group test pytest tests/e2e --minikube
          --values deploy/values/local.yaml --capacity-smoke --maxfail=1
          --evidence-run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          --junitxml=.local/artifacts/kubernetes-e2e.xml --timeout=14400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-e2e-linux
          path: |
            .local/artifacts/kubernetes-e2e.xml
            .local/artifacts/e2e
            .local/artifacts/playwright

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm --filter @agentx/web test --maxWorkers=2
      - run: pnpm build:web
      - run: pnpm --filter @agentx/e2e exec tsc --noEmit

  ci-gate:
    name: CI
    if: ${{ always() }}
    needs: ["python-helm", "frontend", "kubernetes-e2e-linux"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {
              name: job["result"]
              for name, job in jobs.items()
              if job["result"] != "success"
          }
          if failed:
              print(f"Required CI jobs did not succeed: {failed}")
              sys.exit(1)
          print("All mandatory CI jobs passed.")
          PY
