name: MySQL TLS diagnostic
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:mysql-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROFILE: mysql-probe-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - run: uv sync --frozen --group test
      - name: Create the same disposable Minikube runtime
        run: |
          curl --fail --location --retry 3 -o /tmp/minikube https://github.com/kubernetes/minikube/releases/download/v1.39.0/minikube-linux-amd64
          echo 'b738496da01be06bbaf80c688f57ce25acd3849fbb518155f3a88e03ef555aa4  /tmp/minikube' | sha256sum --check
          sudo install /tmp/minikube /usr/local/bin/minikube
          minikube start -p "$PROFILE" --driver=docker --container-runtime=containerd --cni=calico --cpus=4 --memory=12288 --kubernetes-version=v1.36.1 --wait=all
      - name: Compare actual MySQL TLS paths and runtime confinement
        run: uv run --frozen --group test python scripts/ci/mysql_tls_probe.py
      - name: Capture host policy evidence
        if: always()
        run: |
          mkdir -p .local/artifacts/mysql-tls-probe
          sudo journalctl -k --no-pager --since '25 minutes ago' | grep -E 'apparmor=.*DENIED.*mysqld' > .local/artifacts/mysql-tls-probe/host-apparmor.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-tls-probe-${{ github.sha }}
          path: .local/artifacts/mysql-tls-probe
      - name: Delete only this diagnostic cluster
        if: always()
        run: |
          if command -v minikube >/dev/null; then minikube delete -p "$PROFILE"; fi
