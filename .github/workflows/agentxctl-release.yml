name: agentxctl-release
on:
  push:
    tags: ["agentxctl-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag containing the hosted CI profiles
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: agentxctl-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  source-ci:
    uses: ./.github/workflows/quality.yml
    with:
      full: true
      ref: ${{ inputs.tag || github.ref }}
  build:
    needs: source-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl, archive: tar.gz, standalone: agentxctl-linux-x86_64}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, archive: zip, standalone: agentxctl-windows-x86_64.exe}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: uv sync --frozen --group test
      - name: Verify the exact release source version
        run: uv run --frozen --group test python -m tools.scripts.release.verify_release --version "$RELEASE_TAG" --versions-only
      - run: cargo build --release --locked -p agentxctl --target ${{ matrix.target }}
      - name: Package, extract and execute the native candidate
        run: uv run --frozen --group test python tools/scripts/release/package_agentxctl.py --version "$RELEASE_TAG" --target "${{ matrix.target }}"
      - name: Record the hosted candidate's scope and immutable source
        env:
          STANDALONE_ASSET: ${{ matrix.standalone }}
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          root = Path(".local/dist")
          report = {
              "scope": "hosted-software-candidate",
              "standaloneAsset": os.environ["STANDALONE_ASSET"],
              "sourceCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "deferred": ["real-provider-quality", "production-capacity", "public-registry-signing-and-publication"],
          }
          (root / "candidate-scope.json").write_text(json.dumps(report, indent=2) + "\n")
      - uses: actions/upload-artifact@v4
        with:
          name: agentxctl-${{ matrix.target }}-${{ github.run_id }}
          path: .local/dist
          if-no-files-found: error
          retention-days: 30
  release-gate:
    name: Release CI
    if: always()
    needs: [source-ci, build]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          failed = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Hosted release candidate acceptance failed: {failed}")
          print("Hosted controlled system E2E and both native package candidates passed.")
          print("Independent environment certification and public publication remain deferred.")
