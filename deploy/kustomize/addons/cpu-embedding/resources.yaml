apiVersion: v1
kind: Service
metadata:
  name: cpu-embedding
spec:
  selector:
    app.kubernetes.io/name: cpu-embedding
  ports:
    - { name: http, port: 7997, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-embedding
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-embedding
        agentx.io/runtime-provider: allowed
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cpu-embedding
          image: agentx/cpu-embedding:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 7997 }
          env:
            - name: INFINITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentx-embedding-secrets
                  key: API_KEY
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: temporary
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpu-embedding-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: cpu-embedding }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports: [{ protocol: TCP, port: 7997 }]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpu-embedding-client-egress
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [lightrag, mem0] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: cpu-embedding } }
      ports: [{ protocol: TCP, port: 7997 }]
