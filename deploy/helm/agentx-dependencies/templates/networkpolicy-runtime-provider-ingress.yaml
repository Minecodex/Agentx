apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-provider-ingress, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 5432 }
        # plan7 P7-D1: the RAGFlow stack talks to its own ES/MySQL/MinIO on
        # these ports; provider-to-provider traffic within the namespace.
        - { protocol: TCP, port: 9200 }
        - { protocol: TCP, port: 9380 }
        - { protocol: TCP, port: 9000 }
        - { protocol: TCP, port: 3306 }
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/plane: runtime } }
      ports: [{ protocol: TCP, port: 8081 }]
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/plane: runtime } }
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { agentx.io/plane: runtime } }
          podSelector: { matchLabels: { agentx.io/plane: runtime } }
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 9621 }
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 9380 }
