{{- if eq .Values.global.components.objectStorage.mode "bundled-minio" }}
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: object-storage, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  serviceName: object-storage
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: object-storage } }
  template:
    metadata: { labels: { app.kubernetes.io/name: object-storage, agentx.io/plane: dependencies } }
    spec:
      serviceAccountName: object-storage
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          imagePullPolicy: {{ .Values.global.images.pullPolicy }}
          args: [server, /data, --console-address, ":9001"]
          envFrom: [{ secretRef: { name: {{ .Values.global.secrets.dependencies }} } }]
          ports: [{ name: api, containerPort: 9000 }, { name: console, containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
{{- end }}
