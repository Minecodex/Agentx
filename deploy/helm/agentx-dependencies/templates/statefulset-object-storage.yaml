{{- if eq .Values.global.components.objectStorage.mode "bundled-minio" }}
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: object-storage, namespace: {{ .Values.global.namespaces.dependencies }} }
spec:
  serviceName: object-storage
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: object-storage } }
  template:
    metadata: { labels: { app.kubernetes.io/name: object-storage, agentx.io/plane: dependencies } }
    spec:
      serviceAccountName: object-storage
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532 }
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
          imagePullPolicy: {{ .Values.global.images.pullPolicy }}
          args: [server, /data, --console-address, ":9001"{{ if .Values.global.components.objectStorage.caSecretName }}, --certs-dir, /tls{{ end }}]
          envFrom: [{ secretRef: { name: {{ .Values.global.secrets.dependencies }} } }]
          ports: [{ name: api, containerPort: 9000 }, { name: console, containerPort: 9001 }]
          readinessProbe:
            httpGet: { path: /minio/health/live, port: api{{ if .Values.global.components.objectStorage.caSecretName }}, scheme: HTTPS{{ end }} }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
{{- if .Values.global.components.objectStorage.caSecretName }}
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.global.components.objectStorage.caSecretName }}
            items:
              - { key: tls.crt, path: public.crt }
              - { key: tls.key, path: private.key }
              - { key: ca.crt, path: CAs/ca.crt }
{{- end }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
{{- end }}
