apiVersion: apps/v1
kind: Deployment
metadata: { name: runtime-gateway, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  replicas: {{ .Values.runtime.services.runtimeGateway.replicas }}
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: runtime-gateway } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: runtime-gateway, agentx.io/plane: runtime, agentx.io/internal-api: runtime-v1, agentx.io/public-api: runtime, agentx.io/egress-client: managed, agentx.io/metrics: enabled }
    spec:
      serviceAccountName: runtime-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      initContainers:
{{ include "agentx.runtime.schemaGate" (list . "runtimeGateway") | nindent 8 }}
      containers:
        - name: runtime-gateway
          image: {{ include "agentx.image" (list . "runtime-gateway") }}
          imagePullPolicy: {{ .Values.global.images.pullPolicy }}
          env:
            - { name: AGENTX_PLUGIN_WORK_DIR, value: /var/run/agentx/plugin-work }
            - name: AGENTX_INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - { name: AGENTX_RUNTIME_MYSQL_HOST, value: {{ .Values.global.components.runtimeMysql.host | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_PORT, value: {{ .Values.global.components.runtimeMysql.port | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_DATABASE, value: {{ .Values.global.components.runtimeMysql.database | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_USER, value: {{ .Values.global.components.runtimeMysql.appUser | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_MAX_CONNECTIONS, value: {{ .Values.runtime.services.runtimeGateway.mysqlPool | quote }} }
            - { name: AGENTX_RUNTIME_MYSQL_TLS_MODE, value: {{ .Values.global.components.runtimeMysql.tlsMode | quote }} }
            - { name: AGENTX_RUNTIME_REDIS_URL, value: {{ .Values.global.components.runtimeRedis.url | quote }} }
            - { name: AGENTX_RUNTIME_CORS_ALLOWED_ORIGIN, value: {{ printf "%s://%s" (ternary "https" "http" (ne .Values.global.ingress.controlTlsSecretName nil)) .Values.global.ingress.controlHost | quote }} }
            - { name: AGENTX_RUNTIME_CORS_ALLOW_DYNAMIC_ORIGIN, value: {{ ne .Values.global.environment "production" | quote }} }
            - { name: AGENTX_RUNTIME_GATEWAY_RATE_LIMIT_RPS, value: "50" }
            - { name: AGENTX_RUNTIME_GATEWAY_RATE_LIMIT_BURST, value: "100" }
            - { name: AGENTX_PLUGIN_DESIGN_MAX_PROCESSES, value: "2" }
            - { name: AGENTX_RUNTIME_USER_JWT_ISSUER, value: agentx-platform }
            - { name: AGENTX_RUNTIME_USER_JWT_AUDIENCE, value: agentx-runtime-gateway }
            - { name: AGENTX_RUNTIME_VAULT_ENDPOINT, value: {{ .Values.global.components.secretProvider.endpoint | quote }} }
            - { name: AGENTX_EGRESS_PROXY_URL, value: {{ printf "http://agentx-egress-gateway.%s.svc:3128" .Values.global.namespaces.dependencies | quote }} }
            - { name: AGENTX_EGRESS_HTTP_PROVIDER_SERVICES, value: {{ join "," .Values.global.network.egressGateway.httpProviderServices | quote }} }
            - name: AGENTX_EGRESS_JWT_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_GATEWAY_EGRESS_JWT_KEY_ID } }
            - name: AGENTX_EGRESS_JWT_PRIVATE_KEY_PEM
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_GATEWAY_EGRESS_JWT_PRIVATE_KEY_PEM } }
            - { name: AGENTX_RUNTIME_S3_ENDPOINT, value: {{ .Values.global.components.objectStorage.endpoint | quote }} }
            - { name: AGENTX_RUNTIME_S3_BUCKET, value: {{ .Values.global.components.objectStorage.domains.runtime.bucket | quote }} }
            - { name: AGENTX_RUNTIME_S3_REGION, value: {{ .Values.global.components.objectStorage.region | quote }} }
            - { name: AGENTX_RUNTIME_S3_ALLOW_HTTP, value: {{ .Values.global.components.objectStorage.allowHttp | quote }} }
            - { name: AGENTX_RUNTIME_S3_PATH_STYLE, value: {{ .Values.global.components.objectStorage.pathStyle | quote }} }
            - name: AGENTX_RUNTIME_MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_MYSQL_PASSWORD } }
            - name: AGENTX_RUNTIME_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_S3_ACCESS_KEY } }
            - name: AGENTX_RUNTIME_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_S3_SECRET_KEY } }
            - name: AGENTX_RUNTIME_SERVICE_JWT_PUBLIC_KEYS_JSON
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_SERVICE_JWT_PUBLIC_KEYS_JSON } }
            - name: AGENTX_RUNTIME_BUNDLE_PUBLIC_KEYS_JSON
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_BUNDLE_PUBLIC_KEYS_JSON } }
            - name: AGENTX_RUNTIME_WORK_PACKAGE_PUBLIC_KEYS_JSON
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_WORK_PACKAGE_PUBLIC_KEYS_JSON } }
            - name: AGENTX_RUNTIME_USER_JWT_PUBLIC_KEYS_JSON
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_USER_JWT_PUBLIC_KEYS_JSON } }
            - name: AGENTX_RUNTIME_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_REDIS_PASSWORD } }
            - name: AGENTX_RUNTIME_VAULT_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "agentx.secret" (list . "runtimeGateway" "runtime") }}, key: AGENTX_RUNTIME_VAULT_TOKEN } }
{{ include "agentx.runtime.caEnv" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9091 }
            - { name: metrics, containerPort: 9092 }
          resources: { requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi }, limits: { cpu: 1, memory: 512Mi, ephemeral-storage: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10, failureThreshold: 3 }
          lifecycle: { preStop: { httpGet: { path: /health/drain, port: admin, scheme: HTTP } } }
          volumeMounts:
            - { name: plugin-work, mountPath: /var/run/agentx/plugin-work }
{{- if include "agentx.runtime.hasCa" . }}
{{ include "agentx.runtime.caMount" . | nindent 12 }}
{{- end }}
      volumes:
        - name: plugin-work
          emptyDir: { sizeLimit: 512Mi }
{{- if include "agentx.runtime.hasCa" . }}
{{ include "agentx.runtime.caVolume" . | nindent 8 }}
{{- end }}
