apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-provider-egress, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { agentx.io/plane: runtime } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports: [{ protocol: TCP, port: 8081 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: { matchLabels: { agentx.io/plane: dependencies } }
          podSelector: { matchLabels: { agentx.io/runtime-provider: allowed } }
      ports:
        - { protocol: TCP, port: 8090 }
        - { protocol: TCP, port: 9621 }
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 9380 }
