{{- if eq .Values.global.components.runtimeMysql.mode "bundled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-mysql-init
  namespace: {{ .Values.global.namespaces.runtime }}
data:
  01-users.sh: |
    #!/bin/sh
    set -eu
    app_password="$(cat /run/secrets/agentx/app-password)"
    migrate_password="$(cat /run/secrets/agentx/migrate-password)"
    test -n "$app_password"
    test -n "$migrate_password"
    case "$app_password$migrate_password" in
      *[!A-Za-z0-9]*) echo "MySQL passwords must be alphanumeric" >&2; exit 1 ;;
    esac
    mysql --protocol=socket -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    CREATE DATABASE IF NOT EXISTS agentx_runtime;
    CREATE USER IF NOT EXISTS 'runtime_app'@'%' IDENTIFIED BY '$app_password'{{ if .Values.global.components.runtimeMysql.caSecretName }} REQUIRE SSL{{ end }};
    ALTER USER 'runtime_app'@'%' IDENTIFIED BY '$app_password'{{ if .Values.global.components.runtimeMysql.caSecretName }} REQUIRE SSL{{ end }};
    CREATE USER IF NOT EXISTS 'runtime_migrate'@'%' IDENTIFIED BY '$migrate_password'{{ if .Values.global.components.runtimeMysql.caSecretName }} REQUIRE SSL{{ end }};
    ALTER USER 'runtime_migrate'@'%' IDENTIFIED BY '$migrate_password'{{ if .Values.global.components.runtimeMysql.caSecretName }} REQUIRE SSL{{ end }};
    REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'runtime_app'@'%';
    REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'runtime_migrate'@'%';
    GRANT SELECT, INSERT, UPDATE, DELETE ON agentx_runtime.* TO 'runtime_app'@'%';
    GRANT ALL PRIVILEGES ON agentx_runtime.* TO 'runtime_migrate'@'%';
    FLUSH PRIVILEGES;
    SQL
{{- end }}
