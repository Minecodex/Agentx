apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: workflow-worker-sandbox-egress, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: workflow-worker } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: sandbox-manager } } }]
      ports: [{ protocol: TCP, port: 8080 }]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: runtime-gateway-resolver-egress, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: runtime-gateway } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: sandbox-manager } } }]
      ports: [{ protocol: TCP, port: 8080 }]
