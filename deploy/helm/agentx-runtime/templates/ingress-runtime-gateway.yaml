apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runtime-gateway
  namespace: {{ .Values.global.namespaces.runtime }}
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: {{ printf "%s://%s" (ternary "https" "http" (ne .Values.global.ingress.controlTlsSecretName nil)) .Values.global.ingress.controlHost | quote }}
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization,Content-Type,Idempotency-Key,Last-Event-ID,X-Agentx-Timestamp,X-Agentx-Signature,MCP-Protocol-Version,X-Agentx-Page-Publication,X-Agentx-Page-Revision"
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- with .Values.global.ingress.runtimeTlsSecretName }}
  tls:
    - hosts: [{{ $.Values.global.ingress.runtimeHost | quote }}]
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.global.ingress.runtimeHost }}
      http:
        paths:
          - path: /gateway/v1
            pathType: Prefix
            backend:
              service: { name: runtime-gateway-public, port: { number: 8080 } }
          - path: /oauth2
            pathType: Prefix
            backend:
              service: { name: runtime-gateway-public, port: { number: 8080 } }
          - path: /.well-known
            pathType: Prefix
            backend:
              service: { name: runtime-gateway-public, port: { number: 8080 } }
