{{- if eq .Values.global.components.clickhouse.mode "bundled" }}
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: clickhouse, namespace: {{ .Values.global.namespaces.runtime }} }
spec:
  serviceName: clickhouse
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
  template:
    metadata: { labels: { app.kubernetes.io/name: clickhouse, agentx.io/plane: observability } }
    spec:
      serviceAccountName: observability
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: CLICKHOUSE_DB, value: {{ .Values.global.components.clickhouse.database | quote }} }
            - { name: CLICKHOUSE_USER, value: {{ .Values.global.components.clickhouse.migrateUser | quote }} }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.global.secrets.observability }}, key: AGENTX_CLICKHOUSE_MIGRATE_PASSWORD } }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports: [{ name: http, containerPort: 8123 }, { name: native, containerPort: 9000 }]
          startupProbe:
            httpGet: { path: /ping, port: http{{ if .Values.global.components.clickhouse.caSecretName }}, scheme: HTTPS{{ end }} }
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /ping, port: http{{ if .Values.global.components.clickhouse.caSecretName }}, scheme: HTTPS{{ end }} }
            periodSeconds: 5
          volumeMounts:
{{- if .Values.global.components.clickhouse.caSecretName }}
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: init, mountPath: /etc/clickhouse-server/config.d/tls.xml, subPath: tls.xml, readOnly: true }
{{- end }}
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: clickhouse-secrets, mountPath: /run/secrets/agentx, readOnly: true }
      volumes:
{{- if .Values.global.components.clickhouse.caSecretName }}
        - name: tls
          secret: { secretName: {{ .Values.global.components.clickhouse.caSecretName }} }
{{- end }}
        - name: init
          configMap: { name: clickhouse-init, defaultMode: 0555 }
        - name: clickhouse-secrets
          secret:
            secretName: agentx-observability-secrets
            items:
              - { key: AGENTX_CLICKHOUSE_QUERY_PASSWORD, path: query-password }
              - { key: AGENTX_CLICKHOUSE_CONSUMER_PASSWORD, path: consumer-password }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
{{- end }}
