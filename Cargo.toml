[workspace]
members = [
  "src/crates/agentx-agent-core",
  "src/crates/agentx-key-material",
  "tools/agentxctl",
  "src/crates/agentx-api-types",
  "src/crates/agentx-application",
  "tools/agentx-boundary-check",
  "src/crates/agentx-bundle-builder",
  "src/crates/agentx-control-infrastructure",
  "src/crates/agentx-domain",
  "src/crates/agentx-mysql-lease",
  "src/crates/agentx-node-protocol",
  "src/crates/agentx-runtime",
  "src/crates/agentx-runtime-contracts",
  "src/crates/agentx-runtime-infrastructure",
  "src/crates/agentx-v2-ops",
  "src/crates/agentx-service-kit",
  "src/services/platform-control",
  "src/services/agentx-v2-runtime",
  "src/services/agentx-egress-gateway",
  "src/services/observability",
  "tests/fixtures/echo-mcp",
  "tests/fixtures/echo-node",
  "tests/fixtures/backup-adapter",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.0.5-beta"

[workspace.dependencies]
aes-gcm = "0.10"
aes = "0.8"
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
bytes = "1.10"
clickhouse = { version = "0.13", features = ["time", "uuid", "rustls-tls-aws-lc", "rustls-tls-native-roots"] }
csv = "1.3"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "rand_core"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cron = "0.15"
regex = "1.11"
comrak = { version = "0.35", default-features = false }
config = "0.15"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["http1", "server"] }
hmac = "0.12"
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "native-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
jsonwebtoken = "9.3"
jsonschema = { version = "0.33", default-features = false }
include_dir = "0.7"
ipnet = "2.11"
object_store = { version = "0.11", features = ["aws"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rcgen = "0.13"
rust_decimal = "1.37"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
rmcp = { version = "0.12", default-features = false, features = ["base64", "macros", "server", "transport-streamable-http-server"] }
redis = { version = "0.29", features = ["tokio-rustls-comp", "connection-manager"] }
rsa = { version = "0.9", features = ["pem"] }
secrecy = { version = "0.10", features = ["serde"] }
schemars = { version = "1.0", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
sha1 = "0.10"
quick-xml = "0.37"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "uuid", "time", "json", "rust_decimal", "migrate", "macros"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
futures-util = "0.3"
tempfile = "3.20"
tokio-rustls = "0.26"
tokio-util = "0.7"
tokio-stream = "0.1"
tonic = { version = "0.13", features = ["transport"] }
prost = "0.13"
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["uuid", "time"] }
utoipa-axum = "0.2"
uuid = { version = "1.0", features = ["serde", "v7"] }
url = "2.5"
zeroize = "1.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

agentx-api-types = { path = "src/crates/agentx-api-types" }
agentx-agent-core = { path = "src/crates/agentx-agent-core" }
agentx-key-material = { path = "src/crates/agentx-key-material" }
agentx-bundle-builder = { path = "src/crates/agentx-bundle-builder" }
agentx-application = { path = "src/crates/agentx-application" }
agentx-control-infrastructure = { path = "src/crates/agentx-control-infrastructure" }
agentx-domain = { path = "src/crates/agentx-domain" }
agentx-mysql-lease = { path = "src/crates/agentx-mysql-lease" }
agentx-node-protocol = { path = "src/crates/agentx-node-protocol" }
agentx-runtime = { path = "src/crates/agentx-runtime" }
agentx-runtime-contracts = { path = "src/crates/agentx-runtime-contracts" }
agentx-runtime-infrastructure = { path = "src/crates/agentx-runtime-infrastructure" }
agentx-v2-ops = { path = "src/crates/agentx-v2-ops" }
agentx-service-kit = { path = "src/crates/agentx-service-kit" }
